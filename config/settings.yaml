# VPN Config Parser settings

# --- Source Manager ---
sources:
  max_concurrent_fetches: 10
  github_api_base: "https://api.github.com"

# --- Validator ---
validator:
  # Country filter -- only keep configs from these countries (by remark).
  # No network calls -- instant for 620K+ configs.
  # Empty list = keep all. Common: DE, FI, NL, US, GB, FR, JP, SG, CA
  allowed_countries: []
  allowed_countries_by_list:
    blacklist: ["DE", "FI", "NL", "US", "GB", "FR", "JP", "CA"]
    whitelist: ["RU", "DE", "FI", "NL", "FR"]
  whitelist_ru_ratio: 0.8
  whitelist_eu_countries: ["DE", "FI", "NL", "FR"]

  # If more configs than this are parsed, randomly sample before filtering.
  # Set to 0 to process ALL configs (country filter is instant -- no network).
  max_configs_to_validate: 0

  # SOCKS5 proxy for TCP/TLS validation (optional, only when tcp/tls enabled).
  # proxy_url: "socks5://127.0.0.1:1080"

  # Address guard (SSRF prevention). DNS queries only for hostnames (not IP literals).
  # Set to false to skip DNS entirely and only block private/reserved IP literals.
  check_hostnames: true
  # Per-hostname DNS resolution timeout in seconds.
  resolve_timeout: 5.0

  # GitHub Actions often cannot reach VPN servers directly from data-center IPs.
  # TCP liveness therefore uses a small free SOCKS5 proxy pool parsed from GitHub.
  # TCP only proves that a port opens; TLS adds a stricter handshake check for
  # TLS/REALITY configs. In strict mode low live counts publish fewer configs
  # instead of putting unchecked/dead configs back into the subscriptions.
  tcp_enabled: true
  tls_enabled: true
  tcp_timeout_seconds: 4
  tcp_concurrency: 120
  # 0 = check every candidate: an unprobed remainder is indistinguishable
  # from dead in the output, and TCP probes are cheap next to the Xray stage.
  tcp_candidate_limit: 0
  tcp_search_rounds: 3
  # 0 = no early stop. Per-list values below win over this default, so keep
  # them in sync: the aggregator balances countries over the whole alive pool
  # and the Xray stage (xray_max_alive) caps the survivors afterwards.
  tcp_max_alive: 0
  tcp_max_alive_by_list:
    blacklist: 0
    whitelist: 0
  min_alive_to_filter: 10
  fail_open_on_low_alive: false
  # Keep configs whose transport is not TLS-based (plain ss, vmess security=
  # none): the Xray stage below is the real liveness gate; killing them here
  # only shrinks the pool of potentially living configs.
  drop_unchecked_after_tls: false
  # Cap SOCKS retries per config (0 = try entire pool; inflates TCP false-positives).
  proxy_attempts_per_config: 3
  tls_proxy_attempts_per_config: 3
  # The one budget covers SOCKS connect + TCP + full TLS handshake through a
  # free proxy chain; 6s left little room for slow-but-alive servers.
  tls_timeout_seconds: 10
  tls_concurrency: 80
  # TLS handshake probes verify the server certificate when true. Most VPN
  # servers use self-signed certificates, so the default false only proves
  # that a handshake completes. Enable only for sources known to hold valid
  # certificates — with this off, certificates are never checked.
  tls_verify_certificates: false
  tls_candidate_limit: 0
  xray_enabled: true
  xray_required: true
  xray_drop_unsupported: true
  # 0 = probe every supported candidate; xray_max_alive below is the stop
  # crane. A limit here hides the tail of the list behind a pre-selection
  # that cannot know which configs are actually alive.
  xray_candidate_limit: 0
  xray_candidate_limit_by_list:
    blacklist: 0
    whitelist: 0
  # Same rule as tcp_max_alive: the per-list values below override this one.
  # 300 instead of the former 200: both lists hit the cap every run with ~3000
  # candidates left unprobed, and a bigger verified pool decays slower for
  # subscribers because configs die unevenly. Costs ~20-30 min of Xray stage.
  xray_max_alive: 300
  xray_max_alive_by_list:
    blacklist: 300
    whitelist: 300
  xray_timeout_seconds: 15
  xray_startup_timeout_seconds: 5
  # 10 left the SOCKS pool under-used: each probe is mostly waiting on the
  # network, and Xray instances themselves are cheap.
  xray_concurrency: 15
  # Configs that passed within this window get one fast re-probe instead of
  # the full attempt set, freeing probe budget for new candidates. A config
  # is then published with a verification up to this old, not brand-new.
  # 0 = off (every candidate gets the full attempt set every run).
  verification_ttl_minutes: 180
  # Relaxed L3 gate: free SOCKS5 proxies are unstable. A single real Xray HTTPS
  # probe is enough; do not require a distinct outbound IP or a proxy-network
  # success. The real-handshake barrier still filters garbage configs.
  xray_attempts_per_config: 2
  xray_min_attempt_successes: 1
  xray_min_probe_successes: 1
  # Primary probes dial the VPN server through the SOCKS pool: GitHub
  # Actions egress IPs are exactly what RU servers block, and a direct
  # probe from there marked living configs dead (9/220 survived in the
  # 2026-07-22 run). Each retry rotates to the next proxy.
  xray_probe_via_proxies: true
  xray_proxy_probe_count: 3
  xray_min_proxy_successes: 0
  xray_require_distinct_outbound_ip: false
  # Status-only endpoints only: no identity APIs — ipify answers 403 from
  # many RU exit nodes and its failure burned probe time per config.
  xray_probe_urls:
    - "https://www.gstatic.com/generate_204"
    - "https://cp.cloudflare.com/generate_204"

  # QUIC protocols (hysteria2/tuic) cannot be probed by Xray-core; sing-box
  # provides their L3 check (binary from SINGBOX_EXECUTABLE / bin/ / PATH).
  # Shares the SOCKS pool, the probe URLs and the per-list alive budget.
  singbox_enabled: true
  singbox_timeout_seconds: 15
  singbox_concurrency: 10

  proxy_pool:
    enabled: true
    # If no explicit proxy and no free proxy survives self-check, skip liveness
    # instead of falling back to direct GitHub Actions connections.
    required: true
    validate: true
    # Health tracking: remember which proxies worked and how fast they were.
    # Banned/dead proxies are skipped on the next run, and the fastest recent
    # proxies are tried first, so only genuinely working proxies are used.
    health:
      health_enabled: true
      health_history_file: "output/proxy-health-history.json"
      ban_after_consecutive_failures: 3
      # A proxy ban is time-boxed: after this many seconds the proxy re-enters
      # the pool and a passing self-check resets the counter (0 disables bans).
      ban_seconds: 3600
      latency_window: 5
      max_latency_ms: 8000
    sources:
      - "https://cdn.jsdelivr.net/gh/proxifly/free-proxy-list@main/proxies/protocols/socks5/data.txt"
      - "https://cdn.jsdelivr.net/gh/proxyscrape/free-proxy-list@main/proxies/protocols/socks5/data.txt"
      - "https://raw.githubusercontent.com/iplocate/free-proxy-list/main/protocols/socks5.txt"
    # 300 candidates is enough to fill max_proxies with working SOCKS5;
    # VPSLab/gfpcom mostly served private-IP junk and only slowed the sweep.
    max_candidates: 300
    max_candidates_per_source: 150
    min_proxies: 15
    max_proxies: 40
    search_rounds: 3
    candidate_growth_factor: 2
    retry_delay_seconds: 3
    fetch_timeout_seconds: 10
    validation_timeout_seconds: 5
    validation_concurrency: 50
    probe_host: "api.github.com"
    probe_port: 443
    # Failover self-check targets: a network that filters GitHub but not
    # Google would otherwise reject every living proxy and empty the pool.
    probe_extra_targets:
      - ["www.gstatic.com", 443]

  # GeoIP enrichment: offline database first (unlimited lookups, no API
  # rate limit), ip-api.com as fallback. The mmdb artifact is pinned by
  # checksum and auto-downloaded to data/ (gitignored) on first use.
  geoip_enabled: true
  geoip_mmdb_file: "data/GeoLite2-Country.mmdb"
  geoip_mmdb_url: "https://github.com/P3TERX/GeoLite.mmdb/releases/download/2026.08.22/GeoLite2-Country.mmdb"
  geoip_mmdb_sha256: "ba9a33b56e4c3b61a8df00757e925aac7c59afe757534cf0a32d2f9c6399c9e3"
  geoip_api_url: "https://ip-api.com/json/{ip}"
  # ip-api.com free tier allows 45 req/min; lookups share one global rate
  # limiter, so enrichment takes roughly (distinct addresses / rpm) minutes.
  geoip_requests_per_minute: 40
  # Hard cap per run -- configs beyond it keep country=None instead of making
  # the parse stage run for hours.
  geoip_max_lookups: 300

# --- Quality scoring / stability history ---
quality:
  health_history_enabled: true
  health_history_file: "output/health-history.json"
  # Records untouched for this long are dropped on save. The file is published
  # to the repo on every run, so without a retention window it grows with every
  # config the sources have ever served. Still-banned records are always kept.
  health_history_retention_days: 30
  health_recent_window: 5
  ban_after_consecutive_failures: 2
  ban_cooldown_hours: 12
  max_latency_ms: 10000
  drop_slow_configs: true
  # Do not drop "slow" configs if it would leave fewer than this many alive configs
  # in a list. Keeps the pipeline from discarding the last surviving configs.
  # 0 = never drop slow configs (a fully-slow list keeps its entries).
  min_alive_to_skip_slow_drop: 1
  # Publish only configs that passed this many consecutive runs (the current
  # one included): one-shot "blinking" servers are the main source of dead
  # entries at usage time. Relaxed whenever it would leave fewer than
  # stability_min_alive configs in a list, so the subscription never runs dry.
  min_consecutive_passes: 2
  stability_min_alive: 10
  # The stability gate enforces "stable only" when the stable core reaches
  # BOTH the absolute floor above AND this share of the kept list. Without
  # the relative floor, 10 stable configs out of 500 pruned the other 490
  # down to a stub; with it, pruning only happens when what remains is still
  # a working subscription. 0 restores the purely absolute behavior.
  stability_enforce_fraction: 0.3
  # Skip health/source bans when Xray found no more than this many alive configs,
  # so a small set of proven-working configs is not erased by stale history.
  health_ban_min_alive: 3
  source_health_enabled: true
  source_min_checked: 50
  source_bad_alive_rate: 0.02
  source_good_alive_rate: 0.2
  source_bad_runs_to_ban: 2
  source_ban_cooldown_hours: 12

# --- Aggregator ---
aggregator:
  # Match xray_max_alive (300): throwing away half of the proven-alive configs
  # only shrinks the subscription.
  max_configs_in_output: 300
  sort_by: "country"
  max_per_country: 200

# --- Publisher ---
publisher:
  # The publish target branch comes from GITHUB_BRANCH (CI passes the default
  # branch). Adding `branch:` here would override it for publishing only -- the
  # Telegram links keep reading the env var.
  output_file: "output/subscription.txt"
  mix_output_file: "output/subscription-mix.txt"
  # Mihomo/Clash YAML twin of the combined subscription: v2rayN eats the
  # base64 list, Clash-family clients need YAML.
  clash_output_file: "output/subscription-clash.yaml"
  location_outputs_enabled: true
  location_output_dir: "output/locations"
  location_output_limit: 50
  status_output_file: "output/run-summary.json"
  split_output_files:
    blacklist: "output/subscription-blacklist.txt"
    whitelist: "output/subscription-whitelist.txt"
  commit_message: "auto-update configs [{timestamp}]"
  # Empty-run floor, enforced IN CODE (the workflow's "<10" check runs only
  # after publication): an empty run writes watermark-only placeholders
  # locally but does NOT publish them, so a network failure cannot wipe the
  # live subscription. Metadata (run summary / stats / health) still goes
  # out. 0 restores publish-everything behavior.
  min_publish_configs: 10

# --- Telegram ---
telegram:
  # Per-list floor for verified-alive configs; a run below it gets a warning
  # line in the notification (early warning for dead sources / proxy pool).
  alert_min_alive: 10

# --- LLM Fallback ---
# NOTE: LLM_API_KEY in .env is a Yandex key (AQ.A...) - none of the supported
# providers (groq/openrouter/gemini/dashscope) accepts it, every call 401s.
# Disabled to avoid wasting minutes per run. Set a supported provider key and
# flip back to true to re-enable.
llm:
  enabled: false
  provider: "dashscope"
  model: "qwen-plus"
  api_key_env: "LLM_API_KEY"
  min_text_length: 100
