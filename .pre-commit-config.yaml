# No default_language_version pin: hook envs are built with the interpreter that
# runs pre-commit. Pinning a single minor (e.g. python3.12) makes every Python
# hook unusable on a machine that does not have exactly that version installed.

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: check-merge-conflict
      - id: detect-private-key

  # Keep this rev in sync with the ruff pin in pyproject [project.optional-dependencies].
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.13
    hooks:
      - id: ruff-check
        args: ["--fix", "--exit-non-zero-on-fix"]
      - id: ruff-format

  # Keep this rev in sync with the mypy pin in pyproject [project.optional-dependencies].
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.3.0
    hooks:
      - id: mypy
        # The mirror defaults to args ["--ignore-missing-imports",
        # "--scripts-are-modules"], which is weaker than the `mypy src` CI runs:
        # a missing stub would pass here and fail in CI. Empty args restore the
        # [tool.mypy] strict settings from pyproject.
        args: []
        # mypy is invoked with explicit filenames, so [tool.mypy] exclude does not
        # apply; tests/ must be filtered out by the hook itself.
        files: ^src/
        additional_dependencies:
          - "httpx>=0.27"
          - "PyYAML>=6.0"
          - "python-socks[asyncio]>=2.5"
          - "python-dotenv>=1.0"
          - "types-PyYAML"

  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.9
    hooks:
      - id: bandit
        args: ["-c", "pyproject.toml"]
        additional_dependencies: ["bandit[toml]"]
