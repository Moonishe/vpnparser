# No default_language_version pin: hook envs are built with the interpreter that
# runs pre-commit. Pinning a single minor (e.g. python3.12) makes every Python
# hook unusable on a machine that does not have exactly that version installed.

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: check-merge-conflict
      - id: detect-private-key

  # Keep this rev in sync with requirements-dev.lock (ruff==0.16.4).
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.4
    hooks:
      - id: ruff-check
        args: ["--fix", "--exit-non-zero-on-fix"]
      - id: ruff-format

  # Keep this rev in sync with requirements-dev.lock (mypy==2.3.1).
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.3.1
    hooks:
      - id: mypy
        # The mirror defaults to args ["--ignore-missing-imports",
        # "--scripts-are-modules"], which is weaker than the `mypy src` CI runs:
        # a missing stub would pass here and fail in CI. Empty args restore the
        # [tool.mypy] strict settings from pyproject.
        args: []
        # mypy is invoked with explicit filenames, so [tool.mypy] exclude does not
        # apply; tests/ must be filtered out by the hook itself.
        files: ^src/
        additional_dependencies:
          - "httpx==0.28.1"
          - "PyYAML==6.0.3"
          - "python-socks[asyncio]==3.0.0"
          - "python-dotenv==1.2.3"
          # src/validators/geoip.py imports maxminddb (a declared runtime
          # dependency); without it here the hook env cannot resolve the
          # module under strict=true and every commit failed on geoip.py
          # while CI passed.
          - "maxminddb==3.1.1"
          - "types-PyYAML==6.0.12.20260815"

  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        # -r src mirrors the CI step (bandit -c pyproject.toml -r src):
        # pre-commit passes filenames, but the explicit target keeps the
        # local hook and CI scanning the same tree.
        args: ["-c", "pyproject.toml", "-r", "src"]
        additional_dependencies: ["bandit[toml]==1.9.4"]

  # Keep this rev in sync with requirements-dev.lock (pip-audit==2.10.1).
  # Mirrors the CI `pip-audit --desc` step locally.
  - repo: https://github.com/pypa/pip-audit
    rev: v2.10.1
    hooks:
      - id: pip-audit
        args: ["--desc"]
